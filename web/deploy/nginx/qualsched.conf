# Host nginx location blocks for QualSched Web on lnpitask.umn.edu
# ---------------------------------------------------------------------------
# This is the HOST nginx (the lnpitask reverse proxy in front of the Podman
# containers) — NOT the frontend container's internal nginx (that one lives at
# frontend/nginx.conf). The host config file itself lives outside this repo
# (typically /etc/nginx/conf.d/ or a vhost include on lnpitask); this file is
# the version-controlled source of truth for the QualSched location blocks.
#
# Merge these `location` blocks into the existing lnpitask `server { ... }`
# block that already terminates TLS for lnpitask.umn.edu. Do NOT add a second
# server block / listen / server_name / ssl_certificate — those stay in the
# host's existing vhost.
#
# Do NOT collide with wearable-hub or other apps already on this vhost:
#   /wearable/   /enroll   /webhooks   /qualtrics_dashboard   /tictech/
# Prefix is /qualsched only. Never /wearable.
#
# Upstreams (host-published ports, see deploy/quadlet/):
#   backend  -> 127.0.0.1:8050   (container :8000; health at /health)
#   frontend -> 127.0.0.1:8060   (SPA; /qualsched/ prefix is stripped)
#   Do not use 8030/8040 — those are tictech. Wearable is 8010/8020.
#
# Host nginx sends the whole /qualsched/ prefix to the frontend container so
# the SPA and same-origin API paths work after the strip (trailing URI on
# proxy_pass). The frontend container's nginx already proxies /api/, /auth,
# and /health to backend:8000:
#   /qualsched/           -> frontend /
#   /qualsched/api/…      -> frontend /api/…      -> backend /api/…
#   /qualsched/auth/…     -> frontend /auth/…     -> backend /auth/…
#   /qualsched/health     -> frontend /health     -> backend /health
# Same pattern as wearable-hub `/wearable/` → 8020.
#
# After editing the live host config: `sudo nginx -t && sudo nginx -s reload`.
# ---------------------------------------------------------------------------

# Bare /qualsched (no trailing slash) → /qualsched/ so the prefix-strip
# location matches. Exact-match so it never shadows /qualsched/ below.
location = /qualsched {
    return 301 /qualsched/;
}

# Researcher console (Svelte SPA). Strip the /qualsched/ prefix so the
# frontend container sees "/". Its internal nginx serves the SPA and proxies
# /api/, /auth, /health to the backend. Cookie is forwarded so the researcher
# session (qs_session) and OAuth state cookie survive the host hop.
location /qualsched/ {
    proxy_pass http://127.0.0.1:8060/;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header Cookie            $http_cookie;
}
