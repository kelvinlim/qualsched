name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancelling a superseded PR push is fine: this job is advisory and publishes
# nothing. The tagged release workflow must not share this concurrency group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Version comparison tests
        run: npm run test --workspace @qualsched/ui

      # The v0.2.0 release failed here: svelte-check (and `vite` in dev) never
      # exercised Vite's production alias matcher against `ui/` `?raw` imports.
      - name: Build desktop frontend
        run: npm run build --workspace desktop

      - name: Build web frontend
        run: npm run build --workspace qualsched-web
