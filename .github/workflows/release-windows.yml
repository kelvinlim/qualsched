name: Release (Windows)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Only scope the GITHUB_TOKEN needs, to create the release and upload the installer.
# Declaring the block also drops every other scope to none.
permissions:
  contents: write

# Cancelling mid-upload can leave a release created with a missing asset, which is
# worse than letting a duplicate run queue.
concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # First, so a version typo fails in seconds rather than after a 15-minute build.
      # Node is preinstalled on the runner image, so this works before setup-node.
      - name: Verify version consistency
        shell: bash
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_v=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "package.json      $pkg"
          echo "tauri.conf.json   $conf"
          echo "Cargo.toml        $cargo_v"
          if [ "$pkg" != "$conf" ] || [ "$pkg" != "$cargo_v" ]; then
            echo "::error::Version mismatch between the three manifests."
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "git tag           $tag"
            if [ "$tag" != "$pkg" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match version $pkg."
              exit 1
            fi
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
          cache-on-failure: true

      - name: Install npm dependencies
        run: npm ci

      # Must precede cargo test: tauri-build embeds frontendDist (../dist) at compile
      # time, and dist/ is gitignored so it does not exist on a fresh checkout.
      - name: Build frontend
        run: npm run build

      # --release reuses the same profile as the bundle build below, so dependency
      # artifacts are shared and this costs 1-3 min rather than doubling compile time.
      # --locked fails if Cargo.lock drifted from Cargo.toml after a version bump.
      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --release --locked

      - name: Build Windows installer
        run: npm run tauri build

      # Runs on every trigger, so a manual dispatch still yields a downloadable .exe.
      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: QualSched-windows-x64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: QualSched ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
          body: |
            ## Windows

            Download the `QualSched_*_x64-setup.exe` asset below and run it.
            It installs per-user and needs no administrator rights.

            The installer is not code-signed, so Windows SmartScreen will show
            "Windows protected your PC" — click **More info**, then **Run anyway**.

            Installation needs an internet connection if Microsoft Edge WebView2
            is not already present (it ships with Windows 11).
