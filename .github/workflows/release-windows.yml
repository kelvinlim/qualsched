name: Release (Windows + macOS + Linux)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Only scope the GITHUB_TOKEN needs, to create the release and upload the installers.
# Declaring the block also drops every other scope to none.
permissions:
  contents: write

# Cancelling mid-upload can leave a release created with a missing asset, which is
# worse than letting a duplicate run queue.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Its own job so a version typo fails in seconds, once, rather than separately on
  # each platform after its build has already started.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version consistency
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./desktop/package.json').version")
          conf=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          cargo_v=$(grep -m1 '^version = ' desktop/src-tauri/Cargo.toml | cut -d'"' -f2)
          ui_v=$(node -p "require('./ui/package.json').version")
          web_fe=$(node -p "require('./web/frontend/package.json').version")
          web_be=$(grep -m1 '^version = ' web/backend/pyproject.toml | cut -d'"' -f2)
          echo "desktop/package.json          $pkg"
          echo "desktop tauri.conf.json       $conf"
          echo "desktop Cargo.toml            $cargo_v"
          echo "ui/package.json               $ui_v"
          echo "web/frontend/package.json     $web_fe"
          echo "web/backend/pyproject.toml    $web_be"
          if [ "$pkg" != "$conf" ] || [ "$pkg" != "$cargo_v" ]; then
            echo "::error::Version mismatch between the three desktop manifests."
            exit 1
          fi
          if [ "$pkg" != "$ui_v" ] || [ "$pkg" != "$web_fe" ] || [ "$pkg" != "$web_be" ]; then
            echo "::error::Version mismatch: ui/ and web/ must match desktop $pkg."
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "git tag                       $tag"
            if [ "$tag" != "$pkg" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match version $pkg."
              exit 1
            fi
          fi

  build:
    needs: verify-version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      # One platform failing should not cancel the others; a partial result is still
      # worth downloading, and the release job below refuses to publish either way.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: QualSched-windows-x64
            # NSIS setup.exe plus WiX MSI. Both globs must match: a missing
            # MSI would otherwise still upload the exe and look successful.
            bundle: |
              desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
              desktop/src-tauri/target/release/bundle/msi/*.msi
          - os: macos-latest
            artifact: QualSched-macos-arm64
            bundle: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - os: ubuntu-latest
            artifact: QualSched-linux-x64
            # AppImage plus .deb. Both globs must match: a missing .deb would
            # otherwise still upload the AppImage and look successful.
            bundle: |
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              desktop/src-tauri/target/release/bundle/deb/*.deb

    steps:
      - uses: actions/checkout@v4

      # macos-latest is Apple Silicon, so the default host target is aarch64 and no
      # cross-compilation is needed. Fail loudly if GitHub ever repoints the label at
      # an Intel image, rather than silently shipping an x86_64 build as "arm64".
      - name: Confirm Apple Silicon runner
        if: runner.os == 'macOS'
        run: |
          arch=$(uname -m)
          echo "runner architecture: $arch"
          if [ "$arch" != "arm64" ]; then
            echo "::error::Expected an arm64 runner for the Apple Silicon build, got $arch."
            exit 1
          fi

      # ubuntu-latest is x86_64 today. Fail loudly if GitHub ever repoints the
      # label at arm64, rather than silently shipping an aarch64 build as "x64".
      - name: Confirm Linux x64 runner
        if: runner.os == 'Linux'
        run: |
          arch=$(uname -m)
          echo "runner architecture: $arch"
          if [ "$arch" != "x86_64" ]; then
            echo "::error::Expected an x86_64 runner for the Linux x64 build, got $arch."
            exit 1
          fi

      # Tauri 2 prerequisites (webkit2gtk 4.1, ayatana indicator, rsvg, …) plus
      # patchelf / xdg-utils / file, which the AppImage bundler needs.
      # https://v2.tauri.app/start/prerequisites/
      # https://v2.tauri.app/distribute/pipelines/github/
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            patchelf \
            xdg-utils
          # 24.04 renamed this to libfuse2t64; 22.04 still ships libfuse2.
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'desktop/src-tauri -> target'
          cache-on-failure: true

      - name: Install npm dependencies
        run: npm ci

      # Must precede cargo test: tauri-build embeds frontendDist (../dist) at compile
      # time, and desktop/dist/ is gitignored so it does not exist on a fresh checkout.
      - name: Build frontend
        run: npm run build --workspace desktop

      # --release reuses the same profile as the bundle build below, so dependency
      # artifacts are shared and this costs 1-3 min rather than doubling compile time.
      # --locked fails if Cargo.lock drifted from Cargo.toml after a version bump.
      - name: Run Rust tests
        working-directory: desktop/src-tauri
        run: cargo test --release --locked

      - name: Build installer
        if: runner.os == 'Windows'
        run: npm run tauri --workspace desktop -- build

      # Unsigned is fine for Linux. NO_STRIP skips linuxdeploy's bundled strip,
      # which is too old for the .relr.dyn sections Ubuntu 24.04 / glibc emit
      # and otherwise aborts the AppImage step. APPIMAGE_EXTRACT_AND_RUN avoids
      # needing /dev/fuse on the runner.
      - name: Build installer
        if: runner.os == 'Linux'
        run: npm run tauri --workspace desktop -- build
        env:
          NO_STRIP: 'true'
          APPIMAGE_EXTRACT_AND_RUN: '1'

      # The notary service needs the App Store Connect key as a file on disk.
      - name: Write App Store Connect API key
        if: runner.os == 'macOS'
        run: |
          echo "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}

      # APPLE_CERTIFICATE makes Tauri import the identity into a throwaway keychain,
      # sign with APPLE_SIGNING_IDENTITY, and notarize + staple the .app via the
      # App Store Connect API key.
      - name: Build installer (signed + notarized)
        if: runner.os == 'macOS'
        run: npm run tauri --workspace desktop -- build
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8

      # Tauri notarizes only the .app; an unnotarized DMG wrapper still triggers a
      # Gatekeeper warning on download, so notarize and staple the DMG itself too.
      - name: Notarize and staple DMG
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          dmg=$(ls desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$dmg" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg"
          spctl -a -vv -t open --context context:primary-signature "$dmg"
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # upload-artifact succeeds if *any* glob matches, so require both Windows
      # installers explicitly before the shared upload step.
      - name: Confirm Windows NSIS and MSI exist
        if: runner.os == 'Windows'
        run: |
          Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          Get-ChildItem desktop/src-tauri/target/release/bundle/msi/*.msi

      - name: Confirm Linux AppImage and deb exist
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          ls desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          ls desktop/src-tauri/target/release/bundle/deb/*.deb

      # Runs on every trigger, so a manual dispatch still yields a downloadable build.
      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
          retention-days: 14

  # Publishing from a single job, after all platform builds succeed, keeps the
  # runners from racing to create the same release — and means a tag never
  # yields a release that is missing one platform's installer.
  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - name: Download built installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List what will be attached
        run: find artifacts -type f -print

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: QualSched ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/**/*
          body: |
            ## Windows

            Download either the `QualSched_*_x64-setup.exe` or the `.msi`
            asset below.

            The NSIS `*_x64-setup.exe` installs per-user and needs no
            administrator rights. The MSI is a per-machine installer and
            will prompt for administrator approval.

            Neither installer is code-signed yet, so Windows SmartScreen
            may show "Windows protected your PC" — click **More info**,
            then **Run anyway**. The unsigned NSIS `.exe` is sometimes
            flagged by Defender as a trojan (a known Tauri false positive);
            try the MSI if that happens.

            Installation needs an internet connection if Microsoft Edge
            WebView2 is not already present (it ships with Windows 11).

            ## macOS (Apple Silicon)

            Download the `QualSched_*_aarch64.dmg` asset below, open it, and drag
            QualSched to Applications. Apple Silicon only — it will not run on an
            Intel Mac.

            The app is Developer ID signed and notarized by Apple, so it opens
            normally with no security warnings.

            ## Linux (x64)

            Download the `QualSched_*_amd64.AppImage` for a portable binary, or
            the `.deb` to install on Debian or Ubuntu.

            x64 only — it will not run on ARM. Neither package is code-signed.

            The AppImage is portable: mark it executable (`chmod +x`) and run
            it. The `.deb` is for Debian and Ubuntu (`sudo dpkg -i`).
