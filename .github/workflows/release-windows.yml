name: Release (Windows + macOS)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Only scope the GITHUB_TOKEN needs, to create the release and upload the installers.
# Declaring the block also drops every other scope to none.
permissions:
  contents: write

# Cancelling mid-upload can leave a release created with a missing asset, which is
# worse than letting a duplicate run queue.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Its own job so a version typo fails in seconds, once, rather than separately on
  # each platform after its build has already started.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version consistency
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_v=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "package.json      $pkg"
          echo "tauri.conf.json   $conf"
          echo "Cargo.toml        $cargo_v"
          if [ "$pkg" != "$conf" ] || [ "$pkg" != "$cargo_v" ]; then
            echo "::error::Version mismatch between the three manifests."
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "git tag           $tag"
            if [ "$tag" != "$pkg" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match version $pkg."
              exit 1
            fi
          fi

  build:
    needs: verify-version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      # One platform failing should not cancel the other; a partial result is still
      # worth downloading, and the release job below refuses to publish either way.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: QualSched-windows-x64
            bundle: src-tauri/target/release/bundle/nsis/*-setup.exe
          - os: macos-latest
            artifact: QualSched-macos-arm64
            bundle: src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      - uses: actions/checkout@v4

      # macos-latest is Apple Silicon, so the default host target is aarch64 and no
      # cross-compilation is needed. Fail loudly if GitHub ever repoints the label at
      # an Intel image, rather than silently shipping an x86_64 build as "arm64".
      - name: Confirm Apple Silicon runner
        if: runner.os == 'macOS'
        run: |
          arch=$(uname -m)
          echo "runner architecture: $arch"
          if [ "$arch" != "arm64" ]; then
            echo "::error::Expected an arm64 runner for the Apple Silicon build, got $arch."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
          cache-on-failure: true

      - name: Install npm dependencies
        run: npm ci

      # Must precede cargo test: tauri-build embeds frontendDist (../dist) at compile
      # time, and dist/ is gitignored so it does not exist on a fresh checkout.
      - name: Build frontend
        run: npm run build

      # --release reuses the same profile as the bundle build below, so dependency
      # artifacts are shared and this costs 1-3 min rather than doubling compile time.
      # --locked fails if Cargo.lock drifted from Cargo.toml after a version bump.
      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --release --locked

      - name: Build installer
        run: npm run tauri build

      # Runs on every trigger, so a manual dispatch still yields a downloadable build.
      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
          retention-days: 14

  # Publishing from a single job, after both builds succeed, keeps two runners from
  # racing to create the same release — and means a tag never yields a release that
  # is missing one platform's installer.
  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - name: Download built installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List what will be attached
        run: find artifacts -type f -print

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: QualSched ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/**/*
          body: |
            ## Windows

            Download the `QualSched_*_x64-setup.exe` asset below and run it.
            It installs per-user and needs no administrator rights.

            The installer is not code-signed, so Windows SmartScreen will show
            "Windows protected your PC" — click **More info**, then **Run anyway**.

            Installation needs an internet connection if Microsoft Edge WebView2
            is not already present (it ships with Windows 11).

            ## macOS (Apple Silicon)

            Download the `QualSched_*_aarch64.dmg` asset below, open it, and drag
            QualSched to Applications. Apple Silicon only — it will not run on an
            Intel Mac.

            The app is ad-hoc signed rather than notarised, so the first launch
            reports that QualSched "is damaged and can't be opened". It is not
            damaged: macOS quarantines downloads that Apple has not notarised.
            Clear the quarantine flag once, in Terminal:

            ```
            xattr -dr com.apple.quarantine /Applications/QualSched.app
            ```

            Then open it normally. Right-click → Open does not work for ad-hoc
            signed apps, so the command above is the way through.
